<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Drip Nation | South African Streetwear</title>

<meta name="description" content="Drip Nation South African streetwear. T-shirts, tracksuits and caps. Wear the Drip. Join the Nation.">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0b0d;
color:white;
}

nav{
background:#111115;
padding:20px 6%;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:10;
border-bottom:1px solid #29292f;
}

.logo{
font-size:25px;
font-weight:900;
}

nav a{
color:white;
text-decoration:none;
margin-left:18px;
}

.hero{
text-align:center;
padding:80px 20px;
background:linear-gradient(#25252d,#0b0b0d);
}

.hero h1{
font-size:60px;
margin:0;
}

.hero p{
font-size:22px;
color:#ccc;
}

.btn{
background:#ffc83d;
color:#111;
border:0;
padding:14px 22px;
border-radius:12px;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

section{
max-width:1100px;
margin:auto;
padding:55px 6%;
}

.title{
text-align:center;
font-size:34px;
}

.products{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
}

.card{
background:#17171b;
border:1px solid #29292f;
border-radius:20px;
overflow:hidden;
}

.product{
height:280px;
background:#24252b;
display:flex;
align-items:center;
justify-content:center;
font-size:90px;
}

.info{
padding:22px;
}

.info h2{
margin-top:0;
}

.info p{
color:#ccc;
}

.price{
font-size:27px;
font-weight:bold;
margin:18px 0;
}

.about{
text-align:center;
color:#ccc;
line-height:1.7;
}

.contact{
text-align:center;
}

footer{
text-align:center;
padding:30px;
border-top:1px solid #29292f;
color:#999;
}

.cart{
position:fixed;
right:15px;
bottom:15px;
background:#ffc83d;
color:#111;
padding:13px 18px;
border-radius:12px;
font-weight:bold;
z-index:20;
}

@media(max-width:800px){
.products{
grid-template-columns:1fr;
}

.hero h1{
font-size:45px;
